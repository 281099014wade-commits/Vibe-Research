name: Cross-platform verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    env:
      VRA_PYTHON: python
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            orchestrator/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .agents/skills/data-access/scripts/requirements.txt
      - name: Install Node dependencies
        run: |
          npm ci --prefix orchestrator
          npm ci --prefix desktop
      - name: Install Python dependencies
        run: python -m pip install pytest -r .agents/skills/data-access/scripts/requirements.txt
      - name: Orchestrator tests and typecheck
        run: |
          npm test --prefix orchestrator
          npm run typecheck --prefix orchestrator
      - name: Desktop tests and build
        run: |
          npm test --prefix desktop
          npm run build --prefix desktop
      - name: Python tests
        run: |
          python -m pytest calc/tests -q
          python -m pytest backtest/tests -q
          python -m pytest .agents/skills/data-access/scripts/tests -q
      - name: Parse Windows PowerShell entrypoints
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
